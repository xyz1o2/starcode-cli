[package]
name = "starcode-cli"
version = "0.3.0"
edition = "2021"
default-run = "starcode-cli"

[[bin]]
name = "starcode-cli"
path = "src/main.rs"

[dependencies]
# CLI and command parsing
# "string": 让 Command::name/bin_name 接受运行期 String —— 我们按 argv[0]
# 覆盖程序名（sc / starcode / starcode-cli 共用一个二进制），名字不是 'static。
clap = { version = "4.6", features = ["derive", "string"] }

# Zip extraction (official marketplace GCS fast channel)
zip = { version = "9", default-features = false, features = ["deflate"] }

# Async runtime
tokio = { version = "1.53", features = ["full"] }

# HTTP client for API calls
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }

# JSON handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Terminal UI
# osc52: 打开 crossterm 的 `clipboard::CopyToClipboard`。SSH/WSL 下 `arboard` 写的是
#       远端剪贴板（必然不是用户想要的那个），OSC 52 由本地终端程序接收，才是那条路。
crossterm = { version = "0.29", features = ["use-dev-tty", "bracketed-paste", "osc52"] }
ratatui = "0.30"

# Third-party widgets
# 0.13 起默认 feature `crossterm` 即 crossterm 0.29；`crossterm_0_28` 是降级用的可选项。
tui-textarea = { package = "tui-textarea-2", version = "0.13" }

# Unicode width (for correct padding in TUI)
unicode-width = "0.2"

# Markdown rendering
pulldown-cmark = "0.13"

# File operations
tokio-util = "0.7"
walkdir = "2.5"

# Environment variables
dotenvy = "0.15"

# Logging
log = "0.4"

# Crypto for unique IDs
uuid = { version = "1.28", features = ["v4"] }

# Async processing
futures = "0.3"
async-stream = "0.3"
reqwest-eventsource = "0.6"

# Async trait support for trait methods
async-trait = "0.1"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Directory handling
dirs = "7.0"

# Glob pattern matching for file search
glob = "0.3"

# Regex support for flexible editing
regex = "1.13"

# TOML parsing
toml = "1.1"

# Path diff utilities
pathdiff = "0.2"

# Ripgrep library for fast code search
grep-searcher = "0.1"
grep-regex = "0.1"
ignore = "0.4"  # .gitignore support (used by ripgrep)
globset = "0.4" # glob 匹配（ignore 的同族 crate，语义与 rg --glob 一致）

# Windows cmd output decoding (GBK/GB18030 fallback)
encoding_rs = "0.8"

# MCP (Model Context Protocol) support
# Note: No direct Rust MCP SDK exists, so we'll implement our own or find an alternative

# Temporary file handling for edit operations
tempfile = "3.27"

# Hashing
sha2 = "0.11"
md5 = "0.8"

# Base64 encoding for image support
base64 = "0.23"

# Random jitter for retry logic
rand = "0.10"

# Error handling
anyhow = "1.0"

# Lazy static initialization
once_cell = "1.21"

# Lock-free synchronization (no poisoning)
parking_lot = "0.12"

# LRU cache for query result caching
lru = "0.18"

# JSON Schema validation
jsonschema = "0.58"

# Stream trait helpers
tokio-stream = "0.1"

# Diff generation
similar = "3.2"

# URL parsing
url = "2.5"

# Clipboard support for text selection and copy
arboard = "3.6"
zeroize = { version = "1.9", features = ["derive"] }
rust-embed = "8.13"
lsp-types = "0.97"
image = "0.25"
html2text = "0.17"
readability-rust = "0.1.0"
scraper = "0.27"
mime_guess = "2.0"

# Syntax highlighting (replaces manual keyword-based highlighting)
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }

# AST-aware code chunking (Tree-sitter)
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"

# Sandbox dependencies
thiserror = "2.0"
which = "8.0"
shellexpand = "3.1"
tracing = "0.1"

# Background indexing: file watching (debounced incremental reindex)
notify = "8.2"
# Background indexing: low-priority worker threads (Windows THREAD_PRIORITY_LOWEST 等)
thread-priority = "3.1"

# Multi-provider LLM support (unified provider abstraction)
# rig-core provides core provider abstractions without heavy companion dependencies
# Disable default features to reduce dependencies (no epub, pdf, rayon, websocket, etc.)
rig-core = { version = "0.42", default-features = false, features = ["derive", "reqwest", "rustls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_SystemServices"] }

[profile.release]
strip = true
codegen-units = 16
lto = false