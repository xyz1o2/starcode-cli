[package]
name = "starcode-cli"
version = "0.3.0"
edition = "2021"
default-run = "starcode-cli"

[[bin]]
name = "starcode-cli"
path = "src/main.rs"

[dependencies]
# CLI and command parsing
clap = { version = "4.0", features = ["derive"] }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# HTTP client for API calls
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# JSON handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Terminal UI
crossterm = { version = "0.28", features = ["use-dev-tty", "bracketed-paste"] }
ratatui = { version = "0.30", features = ["crossterm_0_28"] }
libc = "0.2"

# Third-party widgets
tui-textarea = { package = "tui-textarea-2", version = "0.11", features = ["crossterm_0_28"] }

# Unicode width (for correct padding in TUI)
unicode-width = "0.1"

# Text wrapping
textwrap = "0.16"

# Markdown rendering
pulldown-cmark = "0.12"

# File operations
tokio-util = "0.7"
fs-err = "3.0"
walkdir = "2.3"

# Environment variables
dotenvy = "0.15"

# Configuration
config = "0.14"

# Logging
log = "0.4"
env_logger = "0.11"

# Crypto for unique IDs
uuid = { version = "1.0", features = ["v4"] }

# Async processing
futures = "0.3"
async-stream = "0.3"
reqwest-eventsource = "0.5"

# Async trait support for trait methods
async-trait = "0.1"

# Terminal colors and formatting
console = "0.15"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Directory handling
dirs = "5.0"

# Glob pattern matching for file search
glob = "0.3"

# Regex support for flexible editing
regex = "1.10"

# TOML parsing
toml = "0.8"

# Path diff utilities
pathdiff = "0.2"

# Ripgrep library for fast code search
grep-searcher = "0.1"
grep-matcher = "0.1"
grep-regex = "0.1"
ignore = "0.4"  # .gitignore support (used by ripgrep)

# Windows cmd output decoding (GBK/GB18030 fallback)
encoding_rs = "0.8"

# MCP (Model Context Protocol) support
# Note: No direct Rust MCP SDK exists, so we'll implement our own or find an alternative

# Temporary file handling for edit operations
tempfile = "3.14"

# Hashing
sha2 = "0.10"
md5 = "0.7"

# Base64 encoding for image support
base64 = "0.21"

# Random jitter for retry logic
rand = "0.8"

# Error handling
anyhow = "1.0"

# Lazy static initialization
once_cell = "1.19"

# Lock-free synchronization (no poisoning)
parking_lot = "0.12"

# LRU cache for query result caching
lru = "0.12"

# Multi-pattern substring search with SIMD (hint keyword detection)
aho-corasick = "1.1"

# JSON Schema validation
jsonschema = "0.17"

# Stream trait helpers
tokio-stream = "0.1"

# Diff generation
similar = "2.5"

# URL parsing
url = "2.5"

# Clipboard support for text selection and copy
arboard = "3.0"
zeroize = { version = "1.7", features = ["derive"] }
rust-embed = "8.11.0"
lsp-types = "0.97.0"
image = "0.25.9"
html2text = "0.16.5"
syn = { version = "2.0.114", features = ["full", "visit"] }
proc-macro2 = "1.0.105"
lazy_static = "1.5.0"
readability-rust = "0.1.0"
scraper = "0.22"
mime_guess = "2.0.5"

# Syntax highlighting (replaces manual keyword-based highlighting)
syntect = { version = "5.2", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }

# AST-aware code chunking (Tree-sitter)
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"

# Sandbox dependencies
thiserror = "1.0"
which = "6.0"
shellexpand = "3.1"
tracing = "0.1"

# Multi-provider LLM support (unified provider abstraction)
# rig-core provides core provider abstractions without heavy companion dependencies
# Disable default features to reduce dependencies (no epub, pdf, rayon, websocket, etc.)
rig-core = { version = "0.41", default-features = false, features = ["derive", "reqwest", "rustls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_SystemServices"] }

[profile.release]
strip = true
codegen-units = 16
lto = false
