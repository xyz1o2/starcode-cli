name: Security

# 与 ci.yml 保持一致：PR base 为 dev-m（默认分支）。
on:
  push:
    branches: [main]
  pull_request:
    branches: [dev-m]
  workflow_dispatch: {}
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am UTC

permissions:
  contents: read

jobs:
  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    # rustsec/audit-check 发现漏洞时会自动建 issue 跟踪（create-issues 默认开）。
    # 之前 workflow 级只有 contents: read，建 issue 被 GitHub 拒成
    # "Resource not accessible by integration"，job 因此从 warning 变 error。
    # 漏洞本身在最新 Cargo.lock 里已修，这里补上建 issue 所需权限。
    # 有 unmaintained warning 时它还会创建 check-run 显示注释，
    # checks:write 同样必需。
    permissions:
      contents: read
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all
