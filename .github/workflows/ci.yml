name: CI

# PR base 是 dev-m（也是仓库默认分支）。push 仍只监听 main：
# dev-m 上的提交通过 PR 合入，main 只在发布/合并时被动更新。
on:
  push:
    branches: [main]
  pull_request:
    branches: [dev-m]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # fmt 是硬门禁（债务已清零）。
  # clippy 只作建议：仓库还有 ~470 条存量警告（lib target 471 条，0 error），
  # 用 `-D warnings` 门禁会让 CI 长期红灯。警告照常打在日志里。
  # 清完之后把 `-- -D warnings` 加回 clippy 那一步即可恢复成硬门禁。
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # clippy --all-targets 会把 build.rs 和所有 target 编一遍，同样要 C 工具链。
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake pkg-config build-essential

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (advisory)
        run: cargo clippy --workspace --all-targets --locked

  # 真正阻断的快速门禁：能不能编译。放最前面，编译不过就没必要跑测试。
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config build-essential

      - name: cargo check --all-targets
        run: cargo check --workspace --all-targets --locked

  test:
    name: Test (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # rustls 默认走 aws-lc-rs，会编译 C/汇编：Linux 需要 cmake + gcc，
      # macOS 需要 perl，Windows runner 镜像已自带 cmake/NASM。
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config build-essential

      # checkpoint_manager 的测试共用全局环境变量（STAR_FILE_HISTORY_DIR_OVERRIDE 等），
      # 并行跑会互相把对方的 override 删掉，必须串行。
      - name: Run unit tests
        run: cargo test --workspace --lib -- --test-threads=1

      - name: Run doc tests
        run: cargo test --workspace --doc

  build:
    name: Build Release (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config build-essential

      - name: Build release
        run: cargo build --release --locked --bin starcode-cli

      # Windows 上产物是 starcode-cli.exe，直接写死无扩展名的路径必然 Not Found。
      - name: Smoke test
        shell: bash
        run: |
          BIN="./target/release/starcode-cli"
          [ "${RUNNER_OS}" = "Windows" ] && BIN="${BIN}.exe"
          "$BIN" --version
          "$BIN" --help > /dev/null

      - name: Upload binary (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: starcode-cli-${{ runner.os }}-${{ runner.arch }}
          path: target/release/starcode-cli
          retention-days: 7

      - name: Upload binary (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: starcode-cli-${{ runner.os }}-${{ runner.arch }}
          path: target/release/starcode-cli.exe
          retention-days: 7
