name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Lint 是「债务可见」用的，不是门禁。
  # 本仓库当前 fmt 有 120 个文件不通过、clippy 有 542 warning + 3 error
  # （见 CLAUDE.md "Gate state"）。把它们设为 required 会让 CI 长期红灯，
  # 久而久之就没人看了 —— 而且会连带把 release 流程一起卡死。
  # 债务清零后，把下面两处 continue-on-error 删掉即可恢复成硬门禁。
  lint:
    name: Lint & Format (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # 真正阻断的快速门禁：能不能编译。放最前面，编译不过就没必要跑测试。
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config build-essential

      - name: cargo check --all-targets
        run: cargo check --workspace --all-targets --locked

  test:
    name: Test (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # rustls 默认走 aws-lc-rs，会编译 C/汇编：Linux 需要 cmake + gcc，
      # macOS 需要 perl，Windows runner 镜像已自带 cmake/NASM。
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config build-essential

      - name: Run unit tests
        run: cargo test --workspace --lib

      - name: Run doc tests
        run: cargo test --workspace --doc

      # eval 任务集在 STAR_API_KEY 为空时全部走 skip，不需要联网也不会烧额度。
      - name: Run eval harness tests
        run: cargo test --workspace --test eval_harness_live -- --test-threads=1
        env:
          STAR_API_KEY: ""

  build:
    name: Build Release (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config build-essential

      - name: Build release
        run: cargo build --release --locked --bin starcode-cli

      - name: Smoke test
        shell: bash
        run: |
          ./target/release/starcode-cli --version

      - name: Upload binary (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: starcode-cli-${{ runner.os }}-${{ runner.arch }}
          path: target/release/starcode-cli
          retention-days: 7

      - name: Upload binary (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: starcode-cli-${{ runner.os }}-${{ runner.arch }}
          path: target/release/starcode-cli.exe
          retention-days: 7
