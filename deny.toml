# cargo-deny 配置（Security workflow 的 `cargo deny check all` 用）。
#
# 之前仓库长期没有此文件，cargo-deny 走内置默认配置：默认 `[licenses] allow`
# 是**空的**，要求每个依赖的许可证都被显式允许，于是所有依赖一律
# `rejected: license is not explicitly allowed`，Cargo Deny job 永远红灯。
#
# 下面的 allow 列表按当前依赖树里**实际出现**的许可证逐条放行：
#   - 宽松许可（MIT/Apache/ISC/BSD/Zlib/Unicode 等）常规放行；
#   - MPL-2.0 来自 scraper（网页正文提取）与 dirs/shellexpand，弱 copyleft、
#     二进制分发时需提供该部分源码，功能上必须保留，先放行；
#   - NCSA/libfuzzer-sys、CDLA/webpki-roots 同理；
#   - LGPL-2.1-or-later 只出现在 `OR` 表达式里（r-efi: MIT OR Apache-2.0
#     OR LGPL），OR 分支里有 MIT/Apache 兜底，不必单独放行 LGPL。
#
# [advisories]：vulnerability 保持默认 deny——这是 cargo-audit/deny 的核心价值。
# `unmaintained`/`unsound` 在 cargo-deny 0.20 默认是 "all"（连传递依赖的
# unmaintained 都报 error）。当前有三个传递依赖被标 unmaintained：
#   bincode(←syntect)、fxhash(←selectors←scraper)、paste(←pulp←exr←image)，
# 升级路径全在上游手里，不在本仓库控制内。改为 "workspace"：只对**我们直接
# 选择的**依赖报 unmaintained/unsound，传递依赖不再阻断 job。
[advisories]
unmaintained = "workspace"
unsound = "workspace"

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# 若有依赖的许可证**只有** `Apache-2.0 WITH LLVM-exception`（没有 OR 兜底），
# 需要按 crate 加 exception（此字段必需 crate 名）：
#   [[licenses.exceptions]]
#   allow = ["Apache-2.0 WITH LLVM-exception"]
#   crate = "some-crate"
